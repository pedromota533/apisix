apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway-nodeport
  namespace: apisix
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: http
      port: 80
      targetPort: 9080
      nodePort: 30080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 9443
      nodePort: 30443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin-nodeport
  namespace: apisix
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apisix
  ports:
    - name: admin
      port: 9180
      targetPort: 9180
      nodePort: 30180
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard-nodeport
  namespace: apisix
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: apisix-dashboard
  ports:
    - name: dashboard
      port: 9000
      targetPort: 9000
      nodePort: 30900
      protocol: TCP
